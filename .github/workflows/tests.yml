name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ benchmarks/ examples/

      - name: Type check
        run: mypy src/deconcord --ignore-missing-imports

      - name: Run tests
        run: pytest -v

  cli-smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Run CLI end-to-end on a real fixture
        run: |
          deconcord tests/fixtures/cli_counts.csv \
            --group1 sample1,sample2 --group2 sample3,sample4 \
            --out /tmp/deconcord_ci_smoke
          test -f /tmp/deconcord_ci_smoke/tables/differential_expression.csv
          test -f /tmp/deconcord_ci_smoke/figures/volcano.png
          test -f /tmp/deconcord_ci_smoke/run_metadata.json
